<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persona Manager · PyPlayVNC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent:   #7c6aff;
      --accent2:  #00c896;
      --danger:   #ff4d6d;
      --warn:     #f5a623;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --radius:   10px;
      --font:     'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Layout ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    header h1 span { color: var(--accent); }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }
    .badge-active  { background: #14532d; color: #4ade80; }
    .badge-idle    { background: #1c1917; color: #a8a29e; }
    .badge-session { background: #1e3a5f; color: #60a5fa; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar-right { margin-left: auto; display: flex; gap: 8px; }

    /* ── Cards grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card.running { border-color: var(--accent2); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .card-name {
      font-size: 16px;
      font-weight: 700;
      word-break: break-all;
    }
    .card-desc { color: var(--muted); font-size: 13px; line-height: 1.5; }

    .accounts { display: flex; flex-direction: column; gap: 4px; }
    .account-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #1e2235;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      color: #94a3b8;
    }
    .account-tag strong { color: var(--text); }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    /* ── Buttons ── */
    button, .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-success   { background: #065f46; color: #6ee7b7; }
    .btn-danger    { background: #7f1d1d; color: #fca5a5; }
    .btn-warn      { background: #78350f; color: #fcd34d; }
    .btn-ghost     { background: var(--border); color: var(--text); }
    .btn-sm        { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

    /* ── Modal ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 460px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal h2 { font-size: 17px; font-weight: 700; }

    /* ── Form ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    input, textarea, select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 9px 12px;
      width: 100%;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }

    .account-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: all .25s;
      pointer-events: none;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok   { border-color: var(--accent2); color: var(--accent2); }
    #toast.err  { border-color: var(--danger); color: var(--danger); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* ── URL input row ── */
    .url-row { display: flex; gap: 8px; align-items: center; }
    .url-row input { flex: 1; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin .7s linear infinite; }

    /* ── Notes ── */
    .notes-text {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <h1>🎭 <span>Persona</span> Manager</h1>
  <div id="headerStatus" style="color:var(--muted);font-size:12px;">Loading…</div>
</header>

<main>
  <div class="toolbar">
    <button class="btn-primary" id="newPersonaBtn">＋ New Persona</button>
    <div class="toolbar-right">
      <button class="btn-ghost" id="refreshBtn" title="Refresh">⟳ Refresh</button>
      <button class="btn-ghost" id="resetKeyBtn" title="Change API key">🔑 Key</button>
    </div>
  </div>

  <div id="grid" class="grid"></div>
</main>

<!-- ── Create / Edit Modal ── -->
<div id="modalOverlay" class="overlay">
  <div class="modal">
    <h2 id="modalTitle">New Persona</h2>

    <div class="form-group">
      <label>Name <span style="color:var(--muted)">(alphanumeric, hyphens, underscores)</span></label>
      <input id="f_name" placeholder="e.g. personal" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <input id="f_desc" placeholder="e.g. Personal browser profile" />
    </div>

    <div class="form-group">
      <label>Accounts</label>
      <div id="accountsContainer"></div>
      <button class="btn-ghost btn-sm" style="margin-top:6px" id="addAccountBtn">＋ Add Account</button>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea id="f_notes" placeholder="Any notes about this persona…"></textarea>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn-ghost" id="cancelPersonaBtn">Cancel</button>
      <button class="btn-primary" id="modalSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ── Launch Modal ── -->
<div id="launchOverlay" class="overlay">
  <div class="modal">
    <h2>Launch Browser</h2>
    <p style="color:var(--muted);font-size:13px;line-height:1.6">
Opens Chromium in the VNC session for manual use. Connect through the
locally bound VNC port or an authenticated SSH tunnel.
    </p>
    <div class="form-group">
      <label>Starting URL</label>
      <input id="launchUrl" value="https://example.com" />
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button class="btn-ghost" id="cancelLaunchBtn">Cancel</button>
      <button class="btn-success" id="launchConfirmBtn">🚀 Launch</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<script src="/static/app.js" defer></script>

</body>
</html>
