services:
  pyplayvnc:
    build:
      context: .
    image: shashankrawlani/playwright_python_vnc:1.61.0
    container_name: pyplayvnc
    init: true
    ports:
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:8888:8080"
    volumes:
      - ./profiles:/app/profiles
      - ./shared:/shared
    environment:
      DISPLAY: ":99"
      SCREEN_RES: ${SCREEN_RES:-1280x1024x24}
      PROFILES_ROOT: /app/profiles
      LOCK_ROOT: /tmp/pyplayvnc-locks
      API_KEY_HASH: ${API_KEY_HASH:?Set API_KEY_HASH in .env}
      VNC_PASSWORD_FILE: /run/secrets/vnc_password
    secrets:
      - vnc_password
    shm_size: 2gb
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    # Chromium's setuid sandbox needs these capabilities because this host
    # disables unprivileged user namespaces. The browser still runs non-root,
    # and the setuid helper drops its setup privileges inside the sandbox.
    cap_add:
      - SETGID
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
    restart: unless-stopped

secrets:
  vnc_password:
    file: ./secrets/vnc_password
